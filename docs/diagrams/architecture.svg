<text x="528.6666666666667" y="448" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Timeouts, bounded output</text>
<rect x="941.3333333333334" y="396" width="410.6666666666667" height="82" rx="13" fill="#12243A" stroke="#263D58" stroke-width="1" />
<text x="955.3333333333334" y="424" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" >Report model</text>
<text x="955.3333333333334" y="448" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Stable finding codes + status</text>
