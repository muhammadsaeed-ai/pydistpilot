<text x="742.0" y="596" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" >Sdist round trip</text>
<text x="742.0" y="620" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Rebuild wheel from source archive</text>
<rect x="1048.0" y="568" width="304.0" height="154" rx="13" fill="#12243A" stroke="#263D58" stroke-width="1" />
