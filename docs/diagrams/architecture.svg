<text x="102.0" y="864" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Wheel / sdist / retained builds</text>
<rect x="514.6666666666667" y="812" width="410.6666666666667" height="84" rx="13" fill="#12243A" stroke="#263D58" stroke-width="1" />
<text x="528.6666666666667" y="840" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" >Evidence</text>
<text x="528.6666666666667" y="864" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >JSON report + concise terminal summary</text>
<rect x="941.3333333333334" y="812" width="410.6666666666667" height="84" rx="13" fill="#12243A" stroke="#263D58" stroke-width="1" />
<text x="955.3333333333334" y="840" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" >Automation</text>
<text x="955.3333333333334" y="864" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Exit codes for scripts and CI</text>
