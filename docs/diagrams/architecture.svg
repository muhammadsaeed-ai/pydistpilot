<text x="88" y="552" fill="#B9A1FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" text-anchor="start" letter-spacing="1.5">03  VERIFICATION CORE</text>
<rect x="88.0" y="568" width="304.0" height="154" rx="13" fill="#12243A" stroke="#263D58" stroke-width="1" />
