<text x="1062.0" y="620" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" >Fresh venv, isolated imports, --help</text>
<rect x="64" y="764" width="1312" height="146" rx="20" fill="#0D1B2D" stroke="#66E3B1" stroke-width="1.5" />
