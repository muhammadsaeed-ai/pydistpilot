<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">PyDistPilot end-to-end verification workflow</title><desc id="desc">Workflow from source project through builds, static inspection, source distribution rebuild, clean virtual environments, smoke checks, and final report with explicit pass or failure.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset="1" stop-color="#0D2038"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59D7FF"/><stop offset="1" stop-color="#B9A1FF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#19314A" stroke-width="0.7" opacity="0.5"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"/></filter>
</defs>
<rect width="1600" height="540" rx="26" fill="url(#bg)"/>
<rect width="1600" height="540" rx="26" fill="url(#grid)" opacity="0.78"/>
<text x="58" y="70" fill="#59D7FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" text-anchor="start" letter-spacing="2.5">END-TO-END WORKFLOW</text>
<text x="58" y="115" fill="#F4F8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" text-anchor="start" >Follow the artifact all the way to a fresh install.</text>
<text x="58" y="149" fill="#A9BCD2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" >The source checkout is the input; the built distribution is the thing being tested.</text>
