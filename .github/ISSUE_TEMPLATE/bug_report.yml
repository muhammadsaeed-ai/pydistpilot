name: Bug report
description: Report a reproducible PyDistPilot defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Review logs and JSON reports for secrets/private paths before posting. Use private security reporting for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: PyDistPilot version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and implementation
      placeholder: CPython 3.13.5
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Exact command and reproduction steps
      description: Include the smallest safe reproduction; remove tokens and private data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / finding code
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
