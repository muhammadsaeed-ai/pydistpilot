name: Materialize full source archive

on:
  push:
    paths:
      - "downloads/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with write permission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Check for staged archive chunks
        id: source
        shell: bash
        run: |
          if [ -f "downloads/READY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reassemble and materialize repository files
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find downloads -maxdepth 1 -type f -name 'source.tar.gz.b64.part-*' -print -quit)"
          tmp="$(mktemp -d)"
          cat downloads/source.tar.gz.b64.part-* | base64 --decode > "$tmp/source.tar.gz"
          listing="$(tar -tzf "$tmp/source.tar.gz")"
          printf '%s\n' "$listing" | grep -Fx 'pydistpilot/pyproject.toml' >/dev/null
          printf '%s\n' "$listing" | grep -Fx 'pydistpilot/src/pydistpilot/cli.py' >/dev/null
          tar -xzf "$tmp/source.tar.gz" -C "$tmp"
          test -f "$tmp/pydistpilot/README.md"
          # Preserve the already-installed Actions workflows: the repository token
          # has contents write permission but not permission to modify workflow files.
          mkdir -p "$tmp/existing-workflows"
          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. "$tmp/existing-workflows/"
          fi
          cp -a "$tmp/pydistpilot/." .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$tmp/existing-workflows/." .github/workflows/
          rm -rf downloads
          python -m compileall -q src
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: materialize complete PyDistPilot 0.2.0 source tree"
          git push
      - name: Explain no-op runs
        if: steps.source.outputs.present != 'true'
        run: echo "No source archive is queued for materialization."
