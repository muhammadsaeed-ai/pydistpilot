name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src/pydistpilot
      - name: Verify built package and resolve runtime dependencies
        run: python -m pydistpilot verify . --install-deps --report "${{ runner.temp }}/pydistpilot-report.json" --sarif "${{ runner.temp }}/pydistpilot-report.sarif"
      - name: Validate SARIF output
        run: python -c "import json, os; p = os.path.join(os.environ['RUNNER_TEMP'], 'pydistpilot-report.sarif'); d = json.load(open(p, encoding='utf-8')); assert d.get('version') == '2.1.0' and len(d.get('runs', [])) == 1 and 'driver' in d['runs'][0]['tool']"
      - name: Build distributions
        run: python -m build --no-isolation --outdir "${{ runner.temp }}/pydistpilot-dist" .
      - name: Check distribution metadata
        run: python -c "import glob, os, subprocess, sys; files = sorted(glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'pydistpilot-dist', '*'))); sys.exit(subprocess.run([sys.executable, '-m', 'twine', 'check', *files], check=False).returncode)"

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install project and audit tool
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Audit installed dependencies
        run: pip-audit
